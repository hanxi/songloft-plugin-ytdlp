name: Release Plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: '可选版本号，适用于下一笔正式发布或本次预发布（Y.M.D.N）'
        required: false
        default: ''
      prerelease:
        description: '为当前主线生成预发布包'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-plugin
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build, verify and publish each pending commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Activation boundary only; later runs use plugin.json.releaseSource.
          RELEASE_BASE_SHA: 55fce95241c387f416e5902c4bb8f078e11ba311
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_CONTEXT_FILE: ${{ runner.temp }}/ytdlp-release-context.json
          RELEASE_ARTIFACTS_DIR: ${{ runner.temp }}/ytdlp-release-assets
        run: node scripts/release-plugin.mjs

      - name: Pass published release identities to the asynchronous ARM build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-contexts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ytdlp-release-context.json
          if-no-files-found: ignore

      - name: Preserve verified release assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-release-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ytdlp-release-assets/
          if-no-files-found: ignore
          compression-level: 0
