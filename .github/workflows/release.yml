name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空按北京时间自动生成 Y.M.D.N，末位从 0 递增）'
        required: false
        default: ''
      prerelease:
        description: '预发布，不更新正式插件源清单'
        type: boolean
        default: false

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies and check plugin
        run: |
          pnpm install
          pnpm run typecheck
          pnpm test

      - name: Resolve plugin version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(node scripts/release-version.mjs)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; use a new version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build matching plugin and release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/prepare-release.mjs
          pnpm test
          pnpm run build
          mkdir -p release-assets
          cp dist/ytdlp.jsplugin.zip release-assets/
          unzip -p dist/ytdlp.jsplugin.zip plugin.json > release-assets/plugin.json
          node scripts/release-info.mjs
          cd release-assets
          sha256sum ytdlp.jsplugin.zip plugin.json > SHA256SUMS

      - name: Preserve verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-${{ steps.version.outputs.version }}
          path: release-assets/
          compression-level: 0

      - name: Create plugin release without waiting for ARM build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            release-assets/ytdlp.jsplugin.zip \
            release-assets/plugin.json release-assets/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-assets/release-notes.md "${FLAGS[@]}"

      - name: Pass release identity to asynchronous ARM build
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-assets/release-context.json

      - name: Update stable registry manifest
        if: ${{ !inputs.prerelease }}
        run: |
          cp release-assets/plugin.json plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json
          git diff --staged --quiet || git commit -m "chore(release): 更新至 ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
