name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空自动生成 Y.M.D）'
        required: false
        default: ''
      prerelease:
        description: '预发布，不更新正式插件源清单'
        type: boolean
        default: true

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies and check plugin
        run: |
          pnpm install
          pnpm run typecheck
          pnpm test

      - name: Resolve plugin and upstream versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(date +'%Y.%-m.%-d')}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; use a new version" >&2
            exit 1
          fi
          YTDLP_VERSION=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)
          [[ "$YTDLP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ytdlp_version=$YTDLP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout resolved yt-dlp release
        uses: actions/checkout@v4
        with:
          repository: yt-dlp/yt-dlp
          ref: ${{ steps.version.outputs.ytdlp_version }}
          path: upstream-yt-dlp
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - name: Build standalone ARMv7 musl yt-dlp
        uses: docker/build-push-action@v6
        with:
          context: upstream-yt-dlp
          file: scripts/armv7/Dockerfile
          platforms: linux/arm/v7
          build-args: YTDLP_VERSION=${{ steps.version.outputs.ytdlp_version }}
          outputs: type=local,dest=release-assets
          cache-from: type=gha,scope=ytdlp-armv7
          cache-to: type=gha,mode=max,scope=ytdlp-armv7

      - name: Verify in clean Alpine without Python
        env:
          YTDLP_VERSION: ${{ steps.version.outputs.ytdlp_version }}
        run: node scripts/armv7/smoke.mjs release-assets "$YTDLP_VERSION"

      - name: Build matching plugin and release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          YTDLP_VERSION: ${{ steps.version.outputs.ytdlp_version }}
        run: |
          node scripts/prepare-release.mjs
          pnpm test
          pnpm run build
          cp dist/ytdlp.jsplugin.zip release-assets/
          unzip -p dist/ytdlp.jsplugin.zip plugin.json > release-assets/plugin.json
          node scripts/release-info.mjs
          cd release-assets
          sha256sum yt-dlp* ytdlp.jsplugin.zip plugin.json > SHA256SUMS

      - name: Preserve verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-${{ steps.version.outputs.version }}
          path: release-assets/
          compression-level: 0

      - name: Create release with plugin and yt-dlp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          YTDLP_VERSION: ${{ steps.version.outputs.ytdlp_version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            release-assets/ytdlp.jsplugin.zip \
            "release-assets/yt-dlp_musllinux_armv7l#yt-dlp ${YTDLP_VERSION}" \
            release-assets/yt-dlp-LICENSE \
            release-assets/yt-dlp-THIRD_PARTY_LICENSES.txt \
            release-assets/yt-dlp-python-requirements.txt \
            release-assets/yt-dlp-build.json \
            release-assets/plugin.json release-assets/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-assets/release-notes.md "${FLAGS[@]}"

      - name: Update stable registry manifest
        if: ${{ !inputs.prerelease }}
        run: |
          cp release-assets/plugin.json plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json
          git diff --staged --quiet || git commit -m "chore(release): 更新至 ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
