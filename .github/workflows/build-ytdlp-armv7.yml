name: Build yt-dlp ARMv7

on:
  workflow_run:
    workflows: ['Release Plugin']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的插件 Release 标签（如 v2026.10.28.0）'
        required: true

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      releases: ${{ steps.context.outputs.releases }}
    steps:
      - name: Read releases published by the triggering attempt
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.tag }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            releases=$(jq -cn --arg tag "$MANUAL_TAG" '[{tag: $tag, pluginCommit: ""}]')
          else
            name="release-contexts-$RELEASE_ATTEMPT"
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/artifacts?name=$name" --jq .total_count)
            if [ "$count" -gt 0 ]; then
              gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name "$name" --dir release-context
              releases=$(jq -ce '
                if type == "array" and all(.[]; (.tag | test("^v[0-9.]+$")) and (.pluginCommit | test("^[a-f0-9]{40}$")))
                then . else error("Invalid release contexts") end
              ' release-context/ytdlp-release-context.json)
            else
              releases='[]'
            fi
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    concurrency:
      group: ytdlp-armv7-${{ matrix.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target Release and latest stable yt-dlp
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ matrix.tag }}
          RELEASE_SOURCE: ${{ matrix.pluginCommit }}
        run: node scripts/armv7/release.mjs resolve

      - name: Checkout resolved yt-dlp release
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: yt-dlp/yt-dlp
          ref: ${{ steps.release.outputs.ytdlp_version }}
          path: upstream-yt-dlp
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.skip != 'true'
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.skip != 'true'

      - name: Build standalone ARMv7 musl yt-dlp
        if: steps.release.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream-yt-dlp
          file: scripts/armv7/Dockerfile
          platforms: linux/arm/v7
          build-args: YTDLP_VERSION=${{ steps.release.outputs.ytdlp_version }}
          outputs: type=local,dest=armv7-assets
          cache-from: type=gha,scope=ytdlp-armv7
          cache-to: type=gha,mode=max,scope=ytdlp-armv7

      - name: Verify in clean Alpine without Python
        if: steps.release.outputs.skip != 'true'
        env:
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
        run: node scripts/armv7/smoke.mjs armv7-assets "$YTDLP_VERSION"

      - name: Preserve candidate for diagnosis when runtime checks fail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: armv7-candidate-${{ steps.release.outputs.tag }}
          path: armv7-assets/
          if-no-files-found: ignore
          compression-level: 0

      - name: Record source and checksums
        if: steps.release.outputs.skip != 'true'
        env:
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
          PLUGIN_COMMIT: ${{ steps.release.outputs.plugin_commit }}
        run: |
          node scripts/armv7/release.mjs info
          cd armv7-assets
          sha256sum yt-dlp* > yt-dlp-SHA256SUMS

      - name: Preserve verified binary assets
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: armv7-${{ steps.release.outputs.tag }}
          path: armv7-assets/
          compression-level: 0

      - name: Attach binary to existing plugin Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
        run: |
          gh release upload "$TAG" \
            "armv7-assets/yt-dlp_musllinux_armv7l#yt-dlp ${YTDLP_VERSION}" \
            armv7-assets/yt-dlp-LICENSE \
            armv7-assets/yt-dlp-THIRD_PARTY_LICENSES.txt \
            armv7-assets/yt-dlp-python-requirements.txt \
            armv7-assets/yt-dlp-build.json armv7-assets/yt-dlp-SHA256SUMS \
            --clobber

      - name: Update ARM status in Release notes
        if: ${{ always() && steps.release.outputs.tag != '' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
          BUILD_STATUS: ${{ job.status }}
        run: node scripts/armv7/release.mjs status
