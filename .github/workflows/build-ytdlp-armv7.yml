name: Build yt-dlp ARMv7

on:
  workflow_run:
    workflows: ['Release Plugin']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的插件 Release 标签（如 v2026.10.28.0）'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: ytdlp-armv7-${{ github.event.workflow_run.id || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read identity from completed plugin release
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve target Release and latest stable yt-dlp
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/armv7/release.mjs resolve

      - name: Checkout resolved yt-dlp release
        uses: actions/checkout@v4
        with:
          repository: yt-dlp/yt-dlp
          ref: ${{ steps.release.outputs.ytdlp_version }}
          path: upstream-yt-dlp
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - name: Build standalone ARMv7 musl yt-dlp
        uses: docker/build-push-action@v6
        with:
          context: upstream-yt-dlp
          file: scripts/armv7/Dockerfile
          platforms: linux/arm/v7
          build-args: YTDLP_VERSION=${{ steps.release.outputs.ytdlp_version }}
          outputs: type=local,dest=armv7-assets
          cache-from: type=gha,scope=ytdlp-armv7
          cache-to: type=gha,mode=max,scope=ytdlp-armv7

      - name: Verify in clean Alpine without Python
        env:
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
        run: node scripts/armv7/smoke.mjs armv7-assets "$YTDLP_VERSION"

      - name: Preserve candidate for diagnosis when runtime checks fail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: armv7-candidate-${{ steps.release.outputs.tag }}
          path: armv7-assets/
          if-no-files-found: ignore
          compression-level: 0

      - name: Record source and checksums
        env:
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
          PLUGIN_COMMIT: ${{ steps.release.outputs.plugin_commit }}
        run: |
          node scripts/armv7/release.mjs info
          cd armv7-assets
          sha256sum yt-dlp* > yt-dlp-SHA256SUMS

      - name: Preserve verified binary assets
        uses: actions/upload-artifact@v4
        with:
          name: armv7-${{ steps.release.outputs.tag }}
          path: armv7-assets/
          compression-level: 0

      - name: Attach binary to existing plugin Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
        run: |
          gh release upload "$TAG" \
            "armv7-assets/yt-dlp_musllinux_armv7l#yt-dlp ${YTDLP_VERSION}" \
            armv7-assets/yt-dlp-LICENSE \
            armv7-assets/yt-dlp-THIRD_PARTY_LICENSES.txt \
            armv7-assets/yt-dlp-python-requirements.txt \
            armv7-assets/yt-dlp-build.json armv7-assets/yt-dlp-SHA256SUMS \
            --clobber

      - name: Update ARM status in Release notes
        if: ${{ always() && steps.release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          YTDLP_VERSION: ${{ steps.release.outputs.ytdlp_version }}
          BUILD_STATUS: ${{ job.status }}
        run: node scripts/armv7/release.mjs status
